    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700&family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style>
      /* Nexa AI Institutional Intelligence CSS Tokens — Light Mode */
      :root {
          --background: #fdf8f6;
          --surface: #ffffff;
          --surface-container-lowest: #ffffff;
          --surface-container-low: #fdf0ec;
          --surface-container: #f5ede9;
          --surface-container-high: #ede4e0;
          --surface-container-highest: #e6dbd7;
          --surface-variant: #f3e5e1;
          --surface-bright: #ffffff;
          --surface-dim: #e8dbd7;
          --primary: #9d4327;
          --primary-container: #ffdbd2;
          --on-primary-container: #3c0800;
          --on-primary: #ffffff;
          --secondary: #77574e;
          --tertiary: #8b4a38;
          --tertiary-container: #ffdbd1;
          --text-main: #231916;
          --text-muted: #5c3d37;
          --on-surface: #231916;
          --on-surface-variant: #53433f;
          --outline: #857370;
          --outline-variant: #d8c2bc;
      }

      html, body, #root {
          margin: 0;
          padding: 0;
          width: 100%;
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          box-sizing: border-box;
          background-color: #fdf8f6;
          color: #231916;
          -webkit-font-smoothing: antialiased;
      }
      body {
          background-color: var(--background);
          color: var(--on-surface);
          font-family: 'Hanken Grotesk', sans-serif;
      }
      .serif-heading {
          font-family: 'Newsreader', serif;
      }
      .glass-border {
          border: 1px solid rgba(133, 115, 112, 0.2);
      }
      .institutional-card {
          background-color: #fdf0ec;
          border: 1px solid rgba(133, 115, 112, 0.15);
          transition: all 0.2s ease-in-out;
      }
      .institutional-card:hover {
          border-color: rgba(157, 67, 39, 0.35);
          box-shadow: 0 20px 40px rgba(0,0,0,0.08);
      }
      .material-symbols-outlined {
          font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
      }

      /* Scrollbars */
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      .no-scrollbar {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }

      /* Thin custom scrollbar for research panel */
      .custom-scrollbar-thin::-webkit-scrollbar { width: 4px; }
      .custom-scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar-thin::-webkit-scrollbar-thumb {
          background: #d8c2bc;
          border-radius: 10px;
      }

      /* Streaming cursor blink */
      @keyframes blink { 50% { opacity: 0; } }

      /* Custom Range Thumb */
      input[type=range]::-webkit-slider-thumb {
          -webkit-appearance: none;
          height: 18px;
          width: 18px;
          border-radius: 50%;
          background: #9d4327;
          cursor: pointer;
          border: 3px solid #fdf8f6;
          box-shadow: 0 2px 8px rgba(157, 67, 39, 0.3);
      }
    </style>

              "on-surface-variant": "#53433f",

              "surface-container": "#f5ede9",
              "tertiary-fixed": "#ffdbd1",
              "on-secondary-fixed-variant": "#4f453c",
              "surface-dim": "#e8dbd7",
              "inverse-surface": "#392e2b",
              "background": "#fdf8f6",
              "surface-container-lowest": "#ffffff",
              "error-container": "#ffdad6",
              "surface-container-low": "#fdf0ec",
              "on-primary-fixed-variant": "#7e2b16",

              "on-error-container": "#410002",
              "primary-container": "#ffdbd2",
              "primary-fixed-dim": "#ffb4a2",
              "secondary-fixed": "#efe0d4",
              "surface-bright": "#ffffff",
              "on-surface": "#231916",
              "secondary-fixed-dim": "#d2c4b8",
              "on-primary": "#ffffff",
              "on-secondary": "#ffffff",
              "on-tertiary-container": "#3b0900",
              "tertiary": "#8b4a38",
              "primary-fixed": "#ffdbd2",
              "primary": "#9d4327",
              "surface-variant": "#f3e5e1",
              "on-error": "#ffffff",
              "on-background": "#231916",
              "tertiary-container": "#ffdbd1",
              "secondary": "#77574e",
              "inverse-on-surface": "#ffede8",
              "on-primary-container": "#3c0800",
              "on-secondary-fixed": "#221a13",
              "surface-container-highest": "#e6dbd7",
              "tertiary-fixed-dim": "#ffb5a0",
              "outline-variant": "#d8c2bc",
              "on-tertiary-fixed-variant": "#743421",
              "inverse-primary": "#ffb4a2",

              "secondary-container": "#ffdbd2",
              "outline": "#857370",
              "bullish-green": "#12a87a",
              "bearish-red": "#dc2626"
            },
            borderRadius: {
