<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>

    <meta property="og:type" content="website"/>
    <meta property="og:title" content="Nexa AI | AI-Powered Crypto Intelligence Agent"/>
    <meta property="og:description" content="Autonomous multi-agent crypto research, token intelligence, real-time risk scoring, and inspectable on-chain predictions."/>
    <meta property="og:site_name" content="Nexa AI"/>
    <meta property="og:url" content="https://nexaai.io"/>
    <meta property="og:image" content="https://nexaai.io/og-image.png"/>
    <meta name="twitter:card" content="summary_large_image"/>
    <meta name="twitter:title" content="Nexa AI | AI-Powered Crypto Intelligence Agent"/>
    <meta name="twitter:description" content="Autonomous multi-agent crypto research, token intelligence, real-time risk scoring, and inspectable on-chain predictions."/>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>"/>
    <title>Nexa AI | AI-Powered Crypto Intelligence Agent</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&amp;family=Playfair+Display:ital,wght@0,400;0,700;1,400&amp;family=JetBrains+Mono:wght@400;500&amp;family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <style>
      /* Nexa AI Design Tokens (CSS Custom Properties) */
      :root {
          --primary: #4F46E5;
          --primary-light: #EEF2FF;
          --primary-muted: #C7D2FE;
          --text-main: #1E1B4B;
          --text-muted: #6366F1;
          --background: #FAFAFA;
          --surface: #ffffff;
          --outline: #E0E7FF;
          --outline-variant: #F0F4FF;
          --surface-variant: #EEF2FF;
          --surface-bright: #F5F7FF;
          --surface-container-low: #F0F4FF;
          --surface-container-high: #E5EDFF;
          --surface-container-highest: #D8E4FF;
          --on-surface-variant: #6366F1;
      }

      html, body, #root {
          margin: 0;
          padding: 0;
          width: 100%;
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          box-sizing: border-box;
          transition: background-color 0.3s ease, color 0.3s ease;
      }
      body {
          background-color: var(--background);
          color: var(--text-main);
          font-family: 'Inter', sans-serif;
      }
      .serif-heading {
          font-family: 'Playfair Display', serif;
      }
      /* Nexa AI Card Hover */
      .sahara-card {
          background: var(--surface);
          border: 1px solid var(--outline);
          box-shadow: 0 12px 40px -12px rgba(79, 70, 229, 0.08);
          transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1), background-color 0.3s ease, border-color 0.3s ease;
      }
      .sahara-card:hover {
          transform: translateY(-4px);
          border-color: var(--primary);
          box-shadow: 0 20px 40px rgba(79, 70, 229, 0.1);
      }
      .sahara-panel {
          background: var(--surface);
          border: 1px solid var(--outline);
          box-shadow: 0 4px 20px -2px rgba(79, 70, 229, 0.05);
          transition: background-color 0.3s ease, border-color 0.3s ease;
      }
      .sahara-gradient-text {
          background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
          -webkit-background-clip: text;
          background-clip: text;
          -webkit-text-fill-color: transparent;
      }
      /* Custom Slider Styling Sahara */
      input[type=range]::-webkit-slider-thumb {
          -webkit-appearance: none;
          height: 18px;
          width: 18px;
          border-radius: 50%;
          background: #4F46E5;
          cursor: pointer;
          border: 3px solid var(--surface);
          box-shadow: 0 2px 8px rgba(79, 70, 229, 0.3);
          transition: border-color 0.3s ease;
      }
      input[type=range]::-moz-range-thumb {
          height: 18px;
          width: 18px;
          border-radius: 50%;
          background: #4F46E5;
          cursor: pointer;
          border: 3px solid var(--surface);
          box-shadow: 0 2px 8px rgba(79, 70, 229, 0.3);
          transition: border-color 0.3s ease;
      }
      @keyframes subtle-float {
          0%, 100% { transform: translateY(0px); }
          50% { transform: translateY(-10px); }
      }
      .animate-subtle-float { animation: subtle-float 8s ease-in-out infinite; }
      .marquee-container {
          mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
      }
      @keyframes marquee {
          0% { transform: translateX(0); }
          100% { transform: translateX(-50%); }
      }
      .animate-marquee { animation: marquee 40s linear infinite; }

      /* Snap Feed Specific Styles */
      .snap-container {
          scroll-snap-type: y mandatory;
          overflow-y: scroll;
          height: calc(100vh - 80px);
          scrollbar-width: none;
      }
      .snap-container::-webkit-scrollbar {
          display: none;
      }
      .snap-section {
          scroll-snap-align: start;
          scroll-snap-stop: always;
      }
      .sand-pattern {
          background-image: radial-gradient(var(--primary) 0.5px, transparent 0.5px);
          background-size: 32px 32px;
          opacity: 0.03;
      }

      /* AI Market Creator Specific Styles */
      .editorial-shadow {
          box-shadow: 0 4px 20px -2px rgba(194, 101, 42, 0.08);
      }
      .sahara-border {
          border-color: var(--outline-variant);
      }
      .market-card {
          background: var(--surface);
          border: 1px solid var(--outline);
          transition: all 0.3s ease, background-color 0.3s ease, border-color 0.3s ease;
      }
      .market-card:hover {
          border-color: var(--primary);
          transform: translateY(-2px);
      }
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      .no-scrollbar {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
    </style>
    <script id="tailwind-config">
      tailwind.config = {
          theme: {
              extend: {
                  fontFamily: {
                      sans: ["Inter", "sans-serif"],
                      serif: ["Playfair Display", "serif"],
                      mono: ["JetBrains Mono", "monospace"],
                      display: ["Inter", "sans-serif"],
                      body: ["Inter", "sans-serif"]
                  },
                  colors: {
                      primary: "var(--primary)",
                      "primary-container": "var(--primary-light)",
                      secondary: "var(--text-muted)",
                      background: "var(--background)",
                      surface: "var(--surface)",
                      "on-surface": "var(--text-main)",
                      "on-surface-variant": "var(--on-surface-variant)",
                      outline: "var(--outline)",
                      "outline-variant": "var(--outline-variant)",
                      "surface-variant": "var(--surface-variant)",
                      "surface-bright": "var(--surface-bright)",
                      "surface-container-low": "var(--surface-container-low)",
                      "surface-container-high": "var(--surface-container-high)",
                      "surface-container-highest": "var(--surface-container-highest)",
                      "bullish-green": "#16a34a",
                      "bearish-red": "#dc2626",
                      "accent-gold": "#A78BFA",
                      "bullish": "#15803d",
                      "bearish": "#b91c1c",
                      "tertiary": "#7C3AED"
                  },
                  borderRadius: {
                      "DEFAULT": "0.5rem",
                      "lg": "0.75rem",
                      "xl": "1rem",
                      "full": "9999px"
                  },
                  spacing: {
                      "margin-desktop": "40px",
                      "margin-mobile": "20px"
                  }
              }
          }
      }
    </script>
  </head>
  <body class="bg-background text-on-surface selection:bg-primary/20 w-full min-h-screen overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
