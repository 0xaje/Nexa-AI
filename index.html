    <meta property="og:type" content="website"/>
    <meta property="og:title" content="Nexa AI | Institutional Intelligence"/>
    <meta property="og:description" content="Autonomous multi-agent crypto research, token intelligence, real-time risk scoring, and inspectable on-chain predictions."/>
    <meta property="og:site_name" content="Nexa AI"/>
    <meta property="og:url" content="https://nexaai.io"/>
    <meta property="og:image" content="https://nexaai.io/og-image.png"/>
    <meta name="twitter:card" content="summary_large_image"/>
    <meta name="twitter:title" content="Nexa AI | Institutional Intelligence"/>
    <meta name="twitter:description" content="Autonomous multi-agent crypto research, token intelligence, real-time risk scoring, and inspectable on-chain predictions."/>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>"/>
    <title>Nexa AI | Institutional Intelligence</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700&family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style>
      /* Nexa AI Institutional Intelligence CSS Tokens */
      :root, html.dark {
          --background: #161311;
          --surface: #161311;
          --surface-container-lowest: #110d0c;
          --surface-container-low: #1f1b19;
          --surface-container: #231f1d;
          --surface-container-high: #2e2927;
          --surface-container-highest: #393431;
          --surface-variant: #393431;
          --surface-bright: #3d3836;
          --surface-dim: #161311;
          --primary: #ffb4a2;
          --primary-container: #dd7257;
          --on-primary-container: #550f00;
          --on-primary: #5f1503;
          --secondary: #d2c4b8;
          --tertiary: #ffb5a0;
          --tertiary-container: #ce7b63;
          --text-main: #eae1dd;
          --text-muted: #dcc0ba;
          --on-surface: #eae1dd;
          --on-surface-variant: #dcc0ba;
          --outline: #a48b85;
          --outline-variant: #56423d;
      }

      html, body, #root {
          margin: 0;
          padding: 0;
          width: 100%;
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          box-sizing: border-box;
          background-color: #161311;
          color: #eae1dd;
          -webkit-font-smoothing: antialiased;
      }
      body {
          background-color: var(--background);
          color: var(--on-surface);
          font-family: 'Hanken Grotesk', sans-serif;
      }
      .serif-heading {
          font-family: 'Newsreader', serif;
      }
      .glass-border {
          border: 1px solid rgba(164, 139, 133, 0.2);
      }
      .institutional-card {
          background-color: #1f1b19;
          border: 1px solid rgba(164, 139, 133, 0.15);
          transition: all 0.2s ease-in-out;
      }
      .institutional-card:hover {
          border-color: rgba(255, 180, 162, 0.35);
          box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      }
      .material-symbols-outlined {
          font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
      }

      /* Scrollbars */
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      .no-scrollbar {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }

      /* Thin custom scrollbar for research panel */
      .custom-scrollbar-thin::-webkit-scrollbar { width: 4px; }
      .custom-scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar-thin::-webkit-scrollbar-thumb {
          background: #393431;
          border-radius: 10px;
      }

      /* Streaming cursor blink */
      @keyframes blink { 50% { opacity: 0; } }

      /* Custom Range Thumb */
      input[type=range]::-webkit-slider-thumb {
          -webkit-appearance: none;
          height: 18px;
          width: 18px;
          border-radius: 50%;
          background: #ffb4a2;
          cursor: pointer;
          border: 3px solid #161311;
          box-shadow: 0 2px 8px rgba(255, 180, 162, 0.3);
      }
    </style>

              "on-secondary-fixed-variant": "#4f453c",
              "surface-dim": "#161311",
              "inverse-surface": "#eae1dd",
              "background": "#161311",
              "surface-container-lowest": "#110d0c",
              "error-container": "#93000a",
              "surface-container-low": "#1f1b19",
              "on-primary-fixed-variant": "#7e2b16",
              "on-tertiary-fixed": "#3b0900",
              "on-error-container": "#ffdad6",
              "primary-container": "#dd7257",
              "primary-fixed-dim": "#ffb4a2",
              "secondary-fixed": "#efe0d4",
              "surface-bright": "#3d3836",
              "on-surface": "#eae1dd",
              "secondary-fixed-dim": "#d2c4b8",
              "on-primary": "#5f1503",
              "on-secondary": "#372f27",
              "on-tertiary-container": "#4e1707",
              "tertiary": "#ffb5a0",
              "primary-fixed": "#ffdbd2",
              "primary": "#ffb4a2",
              "surface-variant": "#393431",
              "on-error": "#690005",
              "on-background": "#eae1dd",
              "tertiary-container": "#ce7b63",
              "secondary": "#d2c4b8",
              "inverse-on-surface": "#342f2d",
              "on-primary-container": "#550f00",
              "on-secondary-fixed": "#221a13",
              "surface-container-highest": "#393431",
              "tertiary-fixed-dim": "#ffb5a0",
              "outline-variant": "#56423d",
              "on-tertiary-fixed-variant": "#743421",
              "inverse-primary": "#9d422b",
              "on-secondary-container": "#c0b3a7",
              "secondary-container": "#4f453c",
              "outline": "#a48b85",
              "bullish-green": "#10b981",
              "bearish-red": "#ef4444"
            },
            borderRadius: {
              "DEFAULT": "0.125rem",

            },

            },
            fontFamily: {
              "sans": ["Hanken Grotesk", "sans-serif"],
              "serif": ["Newsreader", "serif"],

              "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],

              "headline-xl": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "600"}],

              "headline-lg": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "500"}]
